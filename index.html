<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>OVERSTRIKE</title>
<meta name="description" content="A browser-native first-person shooter. No downloads, no plugins, no assets — everything is generated at runtime." />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="hud" aria-hidden="true"></div>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-logo">OVERSTRIKE</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-msg">initialising</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
