<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OVERSTRIKE</title>
<meta name="description" content="A browser-native first-person shooter. No downloads, no plugins, no assets — everything is generated at runtime." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23070d0a'/%3E%3Cpath d='M7 8h18l-5 5H12v6h8l5 5H7z' fill='%237dff6b'/%3E%3C/svg%3E" />
<script>
try {
  const saved = JSON.parse(localStorage.getItem('overstrike.shell.settings.roam.v2') || 'null');
  if (saved?.values?.reduceMotion === true) document.documentElement.classList.add('os-prefer-reduced-motion');
} catch { /* Storage is optional; the OS preference remains authoritative. */ }
</script>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <div id="shell-root"></div>
    <section id="game-layer" aria-label="Match runtime" aria-hidden="true" inert hidden>
      <canvas id="game-canvas" aria-label="OVERSTRIKE match"></canvas>
      <div id="hud" aria-hidden="true"></div>
      <div id="ui"></div>
      <div id="boot" hidden>
        <div class="boot-logo">OVERSTRIKE</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-msg">Loading match runtime</div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
