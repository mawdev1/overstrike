server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The bundle is ~1.2 MB uncompressed and ~330 KB gzipped. Serving it raw would
    # dominate time-to-first-frame on anything but a LAN.
    # `always` serves the build's .gz even when the requester did not ask for gzip,
    # which is the only way past Fly's re-encoding — the proxy pulls without an
    # Accept-Encoding, so anything conditional hands it plaintext to re-do badly. The
    # response is still labelled Content-Encoding: gzip, which every HTTP client in
    # the path honours. Deliberately no `gunzip on`: it would inflate the body right
    # back for exactly the encoding-less request this is aimed at.
    gzip_static always;

    # Fallback for anything the build step did not pre-compress.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # `text/javascript` is what nginx's own mime.types assigns to .js — listing only
    # `application/javascript` silently left the 1.2 MB bundle uncompressed, and Fly's
    # proxy then re-encoded it at a far lower level (473 KB against 329 KB here).
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets, so those are safe to pin forever.
    # One Cache-Control only: `expires` emits its own, and the pair shipped two.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The sourcemap is built with `sourcemap: 'hidden'` — no browser asks for it, and
    # nothing should hand out 4.8 MB to anyone who guesses the filename.
    location ~ \.map$ {
        return 404;
    }

    # The platform API, proxied SAME-ORIGIN rather than called cross-origin.
    #
    # The shell talks to /v1/* on its own origin and nginx forwards to the control plane over
    # Fly's private network. The alternative — pointing VITE_PLATFORM_BASE_URL at
    # overstrike-platform.fly.dev — makes every call cross-origin, and the platform sends no
    # CORS headers at all, so every request from the browser would be blocked before it left.
    # Adding CORS would also mean Allow-Credentials plus an exact-origin allowlist, because
    # auth.md §3's refresh cookie has to travel. Same-origin needs none of that: the cookie is
    # simply a cookie on overstrike.fly.dev.
    #
    # `resolver` and the variable in `proxy_pass` are both load-bearing: with a literal
    # upstream, nginx resolves the name ONCE at startup and caches it forever, so a platform
    # redeploy with a new private address is a 502 until nginx is restarted. The variable form
    # forces per-request resolution against Fly's internal DNS.
    location /v1/ {
        resolver [fdaa::3] valid=10s ipv6=on;
        set $platform_upstream http://overstrike-platform.internal:8080;
        proxy_pass $platform_upstream;

        proxy_set_header Host $host;
        # PASS THE CHAIN THROUGH UNCHANGED — do not append.
        #
        # `$proxy_add_x_forwarded_for` would append nginx's address, making the chain one entry
        # longer via this path than via the platform's own public hostname. `trustedProxyHops`
        # counts from the RIGHT (`idx = chain.length - hops`), so one setting cannot be correct
        # for both paths, and the wrong one silently keys §9's rate limits and the session IP
        # class on a proxy address — every player in the world sharing one bucket. Passing the
        # Fly edge's header through unchanged keeps both paths at exactly one trusted hop.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never cache an API response: these are per-account and some carry Set-Cookie.
        add_header Cache-Control "no-store" always;
        proxy_buffering off;
    }

    # index.html is the only unfingerprinted file; it must never be cached or a deploy
    # leaves clients pointing at asset hashes that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
