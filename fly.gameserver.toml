# OVERSTRIKE dedicated game server.
#
#   fly deploy --config fly.gameserver.toml --dockerfile Dockerfile.gameserver
#
# A SECOND app, separate from the static site (fly.toml), so the two scale and stop
# independently. The site is stateless and idles to zero; this holds a live match in
# memory and must not.
app = "overstrike-gs"
primary_region = "iad"

# Set OVERSTRIKE_MATCH_TICKET_SECRET to the same independent value as
# PLATFORM_MATCH_TICKET_SECRET with `fly secrets set`; never expose PLATFORM_TOKEN_SECRET
# to a game server. The public listener fails closed without the match-only secret.
# Set OVERSTRIKE_MATCH_CONTROL_SECRET to the same independent value as
# PLATFORM_MATCH_CONTROL_SECRET. It authenticates allocation/status/release control calls.

[build]

[env]
  OVERSTRIKE_REGION = "iad"
  OVERSTRIKE_SERVER_ID = "overstrike-gs-iad-1"
  OVERSTRIKE_PUBLIC_WS_URL = "wss://overstrike-gs.fly.dev"
  OVERSTRIKE_PLATFORM_CONTROL_URL = "https://overstrike-platform.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true

  # The critical difference from the static site, which sets these the other way round.
  #
  # A game server is STATEFUL: stopping an idle machine discards the match, every
  # connected player's entity, and the whole lag-compensation history. Worse, "idle" is
  # measured by request traffic, which a long-lived WebSocket does not generate — so a
  # busy match can look idle and be stopped out from under its players.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    # Connections, not requests: a player holds one WebSocket for the whole match, so
    # request-based limits measure nothing here.
    type = "connections"
    soft_limit = 12
    hard_limit = 16

  [[http_service.checks]]
    # Public /health is deliberately minimal liveness. Match/tick/session detail belongs to
    # authenticated control/debug surfaces; exposing it here makes a load-balancer probe a
    # live-match intelligence relay.
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  # The simulation measured ~148x faster than real time on one core, so a shared CPU is
  # ample for a single match. Memory is dominated by the world and the nav grid (~130 MB
  # observed), so 512 MB leaves real headroom.
  size = "shared-cpu-1x"
  memory = "512mb"
