# OVERSTRIKE platform control plane — accounts, profiles, matches, telemetry.
#
#   fly deploy --config fly.platform.toml --dockerfile Dockerfile.platform
#
# A THIRD app, alongside the static site (fly.toml) and the game server
# (fly.gameserver.toml). The three fail differently and so are configured differently:
# the site is stateless and idles to zero, the game server holds a live match and must
# never stop, and this one holds no match state but owns the database connection and the
# outbox relay.
app = "overstrike-platform"
primary_region = "yyz"        # ca-central-1 per docs/decisions/P0-decisions.md D2

[build]

[deploy]
  # Migrations run ONCE per deployment, here, not on container boot.
  #
  # A container that migrates as it starts races every other container of the same
  # release. The migrator takes an advisory lock, so the race does not corrupt anything —
  # it just means N-1 machines block on boot behind a lock held by a machine that is also
  # trying to pass its health check. A release command runs exactly once, before any new
  # machine is started, which is the property actually wanted.
  #
  # `scripts/pgtest.mjs` asserts every deployment re-runs migrations as a clean no-op, so
  # this is safe to run on every deploy including ones that change no schema.
  release_command = "node platform/src/core/migrate.js"

[env]
  PLATFORM_STORAGE = "postgres"
  PLATFORM_PORT = "8080"
  PLATFORM_LOG_LEVEL = "info"
  PLATFORM_IDENTITY_PROVIDER = "supabase"
  # "none" until a Resend key exists — config.js records exactly what that costs (no
  # verification mail, no recovery delivery; signup still completes). Turning it back on is a
  # one-secret change: set PLATFORM_MAIL_API_KEY and PLATFORM_MAIL_FROM, then flip this to
  # "resend". The pairing guard still refuses "resend" without those two.
  PLATFORM_MAIL_TRANSPORT = "none"
  PLATFORM_MAIL_API_URL = "https://api.resend.com/emails"
  PLATFORM_PUBLIC_BASE_URL = "https://overstrike.fly.dev"
  PLATFORM_LOBBY_PUBLIC_URL = "wss://overstrike.fly.dev"
  PLATFORM_MATCH_SERVER_URL = "wss://overstrike-gs.fly.dev"
  PLATFORM_MATCH_SERVER_ALLOWED_HOSTS = "overstrike-gs.fly.dev"
  PLATFORM_MATCH_SERVER_REGION = "iad"

  # Fly terminates TLS at its edge and forwards one hop. Without this the platform reads
  # the proxy's address as the client's, which would key §9's per-IP auth limit and the
  # session IP class on the edge — every player in the world sharing one bucket, and every
  # session displaying the same location.
  PLATFORM_TRUSTED_PROXY_HOPS = "1"

# SECRETS — set with `fly secrets set`, never in this file, which is in git:
#
#   fly secrets set --app overstrike-platform \
#     DATABASE_URL="postgres://...@...supabase.co:5432/postgres?sslmode=require" \
#     PLATFORM_TOKEN_SECRET="$(openssl rand -hex 32)" \
#     PLATFORM_MATCH_TICKET_SECRET="$(openssl rand -hex 32)" \
#     PLATFORM_MATCH_CONTROL_SECRET="$(openssl rand -hex 32)" \
#     PLATFORM_SERVICE_TOKEN="$(openssl rand -hex 32)" \
#     SUPABASE_URL="https://<project-ref>.supabase.co" \
#     SUPABASE_SERVICE_ROLE_KEY="<service-role-key>" \
#     PLATFORM_MAIL_FROM="Overstrike <accounts@<verified-domain>>" \
#     PLATFORM_MAIL_API_KEY="re_<resend-api-key>" \
#     PLATFORM_ALERT_WEBHOOK_URL="https://<incident-relay>/<secret-route>"
#
# Before the FIRST deploy that enables Supabase, migration 0021 must already be applied, a
# verification and recovery canary must have been delivered through the configured From domain,
# and every pre-existing local-KDF account must be cut over during a maintenance window:
#
#   DATABASE_URL="..." SUPABASE_URL="..." SUPABASE_SERVICE_ROLE_KEY="..." \
#     npm run identity:cutover                 # mandatory dry-run; must report no blockers
#   DATABASE_URL="..." SUPABASE_URL="..." SUPABASE_SERVICE_ROLE_KEY="..." \
#     npm run identity:cutover -- --apply      # creates recovery-required provider users
#   DATABASE_URL="..." npm run identity:cutover  # must then report 0 candidates, 0 blockers
#
# The apply step revokes active sessions and gives each migrated account a random, undisclosed
# provider password, so those players must use the normal password-recovery flow. Production
# also refuses to boot while any live account retains a local credential or lacks a Supabase
# subject. Do not bypass this with PLATFORM_IDENTITY_PROVIDER=local; that is forbidden in prod.
# Readiness separately reports `alerts: down` until PLATFORM_ALERT_WEBHOOK_URL is configured.
# The URL commonly embeds a routing secret and therefore belongs in Fly secrets, never `[env]`.
#
# PLATFORM_TOKEN_SECRET signs access tokens and receipts and is never shared with game servers.
# PLATFORM_MATCH_TICKET_SECRET is a separate key shared only with OVERSTRIKE_MATCH_TICKET_SECRET
# on match servers. Rotating it invalidates outstanding handoffs without signing players out.
# Rotating PLATFORM_TOKEN_SECRET signs out every
# player and invalidates every outstanding eligibility and consent receipt. PLATFORM_SERVICE_
# TOKEN is what the game server presents to submit match results and read /v1/health/ready —
# it is NOT a player credential and must never be shipped to a browser.
#
# config.js fails fast rather than defaulting production credentials: a platform that boots with
# a development signing key, missing provider, or disabled recovery transport would look healthy
# while accepting forged tokens or locking players out.

[http_service]
  internal_port = 8080
  force_https = true

  # Unlike the game server, this is stateless per request — an instance can stop and
  # start freely. It is NOT allowed to idle to zero, though: the outbox relay is a
  # background loop, and a suspended machine stops relaying events that a stopped machine
  # has already committed to the outbox table. min_machines_running = 1 keeps one relay
  # alive; the rest can scale on demand.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  # P2 realtime rooms have one socket authority. Room/member state survives restarts in
  # Postgres, but WebSocket fanout is intentionally single-process until P5 adds the broker.
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    # /v1/health is LIVENESS — process up, no dependencies consulted. It is deliberately
    # not /v1/health/ready: readiness checks the database, and a database blip would
    # otherwise make Fly kill and restart every machine at once, turning a recoverable
    # dependency outage into a full outage. Readiness is service-token gated anyway
    # (§7.1), so Fly could not call it without shipping the token into this file.
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
