# OVERSTRIKE CI.
#
# Two things this workflow exists to make non-skippable, because both were claimed before they
# were true:
#
#   1. The platform suite runs against a REAL PostgreSQL. `storetest` skips its Postgres half
#      when DATABASE_URL is absent, so a memory-only run reports green while five separate
#      defects hid in that gap — an audit table that was not append-only as deployed, SQL
#      injection through object keys, `pg` writing an array column as garbage, a false CAS
#      success, and silent-vs-throwing divergences. CI sets CI=1, under which pgtest FAILS
#      rather than skips when no database is reachable.
#
#   2. The lane guard classifies the actual commit range. Locally it can check the index; in CI
#      the index is empty, so it has to be told the range or it passes by seeing nothing.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  platform:
    name: platform (real postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: overstrike-test
        ports: ['5432:5432']
        # Without this the job races the database: `docker run` returns before Postgres
        # accepts connections, and a connection refused looks exactly like a broken adapter.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: static check
        run: npm run check
      # `npm run ci` referenced an untracked scripts/tdmtest.mjs three times running. It passed
      # on the one machine holding an untracked copy and aborted everywhere else, and this
      # workflow never noticed because it does not call `npm run ci`.
      - name: the ci script only names files that are in the repository
        run: node scripts/citest.mjs
      # DATABASE_URL is set PER STEP, not on the job.
      #
      # As a job-level variable it leaked into the memory step, so a step named "(memory)" ran
      # storetest's PostgreSQL half too — and failed there on a missing `pg`, which made a
      # dependency defect look like a memory-adapter defect. Each step now runs the adapter its
      # name claims, and only one of them can fail for database reasons.
      - name: platform suite (memory)
        run: npm run platformtest
      - name: six-client lobby, allocation and reconnect (memory)
        run: npm run lobbytest && npm run presencetest && npm run lifecyclefaulttest && npm run completiontest
      - name: platform suite (real postgres) + migration replay
        env:
          DATABASE_URL: postgres://postgres:overstrike-test@127.0.0.1:5432/postgres
        run: node scripts/pgtest.mjs --no-docker

  lanes:
    name: lane ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The guard compares against the base, so it needs history rather than a shallow clone.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # EACH COMMIT, not the union of the push.
      #
      # The union inverts the rule. §0.2 says a change touching both lanes must be split, and a
      # correct split produces single-lane commits whose union spans both lanes — so obeying the
      # rule failed this job and the only way to pass was to not split. That is not hypothetical:
      # it rejected a [CC] contract amendment pushed alongside the [CX]-owned request file that
      # answered it, which is precisely the shape the rule asks for.
      - name: cross-lane guard, one commit at a time
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          node scripts/lanecheck.mjs --range="$BASE..HEAD"

  game:
    name: game simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: install browser used by CX acceptance harnesses
        run: npx playwright install --with-deps chromium
      - name: simulation and mode harnesses
        run: npm run simtest && npm run tdmtest && npm run bombtest && npm run bombbottest && npm run nettest && npm run facadetest && npm run wstest && npm run servertest
      - name: deterministic nav artifact and all P3 map guards
        run: npm run maptest && npm run navbake:check && npm run navtest && npm run collisiontest && npm run stairtest && npm run vertprobe && npm run mapbalance && npm run geomtest && npm run siteoutcome
      - name: P2/P3 client acceptance
        run: npm run viteproxytest && npm run uishell && npm run browserlivetest && npm run uimap && npm run mapperf && npm run uibomb && npm run uilobby
